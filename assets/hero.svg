    <text x="35" y="51" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="850">M</text>
  </g>
  <text x="76" y="213" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="65" font-weight="850" letter-spacing="-2">MaglaSync</text>
  <text x="76" y="267" fill="#ddd6fe" font-family="Inter,Segoe UI,sans-serif" font-size="25">One project. Only chosen chats remember.</text>
