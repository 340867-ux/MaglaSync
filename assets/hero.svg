<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">MaglaSync</title>
  <desc id="desc">User-controlled continuity between connected ChatGPT, Claude, and Gemini chats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#2e1065"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="470" rx="30" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="230" fill="#7c3aed" opacity=".13"/>
  <circle cx="1010" cy="470" r="260" fill="#a78bfa" opacity=".08"/>
  <g transform="translate(76 80)">
