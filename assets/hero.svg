    <rect x="301" width="135" height="42" rx="21" fill="#fff" opacity=".1"/><circle cx="322" cy="21" r="5" fill="#34d399"/><text x="338" y="27" fill="#fff">Gemini</text>
  </g>
  <g transform="translate(735 68)" filter="url(#shadow)">
