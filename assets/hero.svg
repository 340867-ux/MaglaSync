    <rect x="19" y="15" width="34" height="34" rx="10" fill="#7c3aed"/><text x="36" y="40" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="850">M</text>
    <text x="66" y="31" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="800">MaglaSync</text><text x="66" y="46" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="9">FREE · LOCAL CONTINUITY</text><circle cx="353" cy="31" r="6" fill="#34d399"/>
    <text x="22" y="91" fill="#6d28d9" font-family="Inter,Segoe UI,sans-serif" font-size="9" font-weight="850" letter-spacing="1">ACTIVE PROJECT</text>
    <rect x="22" y="106" width="245" height="15" rx="7" fill="#111827"/><rect x="22" y="134" width="325" height="8" rx="4" fill="#cbd5e1"/><rect x="22" y="153" width="280" height="8" rx="4" fill="#e2e8f0"/>
    <g transform="translate(22 183)"><rect width="341" height="58" rx="12" fill="#fff" stroke="#e2e8f0"/><text x="14" y="23" fill="#111827" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="800">Review before placing</text><text x="14" y="40" fill="#64748b" font-family="Inter,Segoe UI,sans-serif" font-size="9">Nothing is sent without your action</text><rect x="286" y="18" width="38" height="22" rx="11" fill="#7c3aed"/><circle cx="313" cy="29" r="8" fill="#fff"/></g>
