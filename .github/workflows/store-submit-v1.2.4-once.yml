name: Submit MaglaSync 1.2.4 once

on:
  push:
    branches:
      - ops/store-submit-v1.2.4-once
    paths:
      - .github/workflows/store-submit-v1.2.4-once.yml

permissions:
  contents: read

concurrency:
  group: maglasync-store-submit-v1.2.4-once
  cancel-in-progress: false

env:
  RELEASE_COMMIT: 4809b58fbc58d9dc948ccdfb9ff080ea0ccc4e30
  EXPECTED_VERSION: 1.2.4
  CHROME_EXTENSION_ID: hhcmedgckaedhlegpgphflmmmhfaegpi

jobs:
  chrome-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the verified 1.2.4 release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lock submission to the verified release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json","utf8")).version')"
          test "$VERSION" = "$EXPECTED_VERSION"
          echo "MAGLASYNC_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Rebuild and verify the exact Chrome package
        run: |
          set -euo pipefail
          node --test
          node tools/package.mjs --check
          node tools/package.mjs
          node tools/firefox-lint.mjs
          test -f "dist/maglasync-free-chromium-v${EXPECTED_VERSION}.zip"

      - name: Validate Chrome publisher credentials
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          for name in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN PUBLISHER_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret for Chrome submission: $name" >&2
              exit 1
            fi
          done

      - name: Obtain Chrome Web Store access token
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            https://oauth2.googleapis.com/token \
            --data-urlencode "client_secret=$CLIENT_SECRET" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$REFRESH_TOKEN" \
            --data-urlencode "client_id=$CLIENT_ID")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$RESPONSE")"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "CWS_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Upload Chrome 1.2.4 and wait for processing
        env:
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          PACKAGE="dist/maglasync-free-chromium-v${EXPECTED_VERSION}.zip"
          BASE="https://chromewebstore.googleapis.com"
          UPLOAD_URL="$BASE/upload/v2/publishers/$PUBLISHER_ID/items/$CHROME_EXTENSION_ID:upload"
          STATUS_URL="$BASE/v2/publishers/$PUBLISHER_ID/items/$CHROME_EXTENSION_ID:fetchStatus"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -X POST -T "$PACKAGE" "$UPLOAD_URL" | tee /tmp/cws-status.json

          state() {
            python3 -c 'import json; print(json.load(open("/tmp/cws-status.json")).get("uploadState", ""))'
          }

          STATE="$(state)"
          for attempt in $(seq 1 20); do
            if [ "$STATE" != "UPLOAD_IN_PROGRESS" ]; then
              break
            fi
            sleep 3
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
              "$STATUS_URL" > /tmp/cws-status.json
            cat /tmp/cws-status.json
            STATE="$(state)"
          done

          if [ "$STATE" = "UPLOAD_IN_PROGRESS" ]; then
            echo "Chrome upload is still processing; refusing to publish blindly." >&2
            exit 1
          fi
          case "$STATE" in
            *FAIL*|*ERROR*)
              echo "Chrome upload reported failure state: $STATE" >&2
              exit 1
              ;;
          esac
          echo "Chrome upload processing state: ${STATE:-not-returned}."

      - name: Submit Chrome 1.2.4 for review
        env:
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CWS_ACCESS_TOKEN" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$CHROME_EXTENSION_ID:publish" \
            | tee /tmp/cws-publish.json
          echo "Chrome Web Store submission requested for MaglaSync ${EXPECTED_VERSION}."

  firefox-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the verified 1.2.4 release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lock submission to the verified release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("manifest.json","utf8")).version')"
          test "$VERSION" = "$EXPECTED_VERSION"
          echo "MAGLASYNC_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Rebuild and verify the exact Firefox package
        run: |
          set -euo pipefail
          node --test
          node tools/package.mjs --check
          node tools/package.mjs
          node tools/firefox-lint.mjs
          test -f "dist/maglasync-free-firefox-v${EXPECTED_VERSION}.zip"
          test -f "dist/maglasync-free-firefox-source-v${EXPECTED_VERSION}.zip"

      - name: Validate Mozilla Add-ons credentials
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "Missing AMO_JWT_ISSUER or AMO_JWT_SECRET GitHub secret." >&2
            exit 1
          fi

      - name: Prepare Firefox submission directory
        run: |
          set -euo pipefail
          FIREFOX_DIR="$RUNNER_TEMP/maglasync-firefox-${EXPECTED_VERSION}"
          mkdir -p "$FIREFOX_DIR"
          unzip -q "dist/maglasync-free-firefox-v${EXPECTED_VERSION}.zip" -d "$FIREFOX_DIR"
          test "$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).browser_specific_settings.gecko.id' "$FIREFOX_DIR/manifest.json")" = "maglasync@magla.ru"
          echo "FIREFOX_SUBMISSION_DIR=$FIREFOX_DIR" >> "$GITHUB_ENV"

      - name: Submit Firefox 1.2.4 for listed review
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          npx --yes web-ext@10.6.0 sign \
            --source-dir "$FIREFOX_SUBMISSION_DIR" \
            --channel listed \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET" \
            --approval-timeout 0 \
            --upload-source-code "dist/maglasync-free-firefox-source-v${EXPECTED_VERSION}.zip"
          echo "Mozilla Add-ons submission requested for MaglaSync ${EXPECTED_VERSION}."
