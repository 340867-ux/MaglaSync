name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      - run: node tools/package.mjs --check
      - run: node tools/package.mjs
      - run: node tools/firefox-lint.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: maglasync-free-platform-packages
          path: |
            dist/maglasync-free-chromium-v*.zip
            dist/maglasync-free-firefox-v*.zip
            dist/maglasync-free-firefox-source-v*.zip
            dist/maglasync-free-safari-source-v*.zip
            dist/maglasync-chrome-store-submission-kit-v*.zip
