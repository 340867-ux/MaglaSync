name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
      - run: node tools/package.mjs --check
      - run: node tools/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: maglasync-free-extension
          path: dist/maglasync-free-v*.zip

