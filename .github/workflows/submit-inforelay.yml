name: Submit MaglaSync to InfoRelay once

on:
  push:
    branches:
      - main
    paths:
      - growth/submissions/inforelay-v1.json

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refuse reruns or payload updates
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            echo 'This submission workflow may not be re-run.' >&2
            exit 1
          fi
          STATUS="$(git diff-tree --no-commit-id --name-status -r HEAD -- growth/submissions/inforelay-v1.json)"
          EXPECTED="$(printf 'A\tgrowth/submissions/inforelay-v1.json')"
          if [ "$STATUS" != "$EXPECTED" ]; then
            echo "Expected a first-time payload add, got: $STATUS" >&2
            exit 1
          fi

      - name: Bind maintainer contact from signed commit metadata
        run: |
          set -euo pipefail
          CONTACT_EMAIL="$(git log -1 --format='%ae')"
          if [ -z "$CONTACT_EMAIL" ] || printf '%s' "$CONTACT_EMAIL" | grep -qi 'noreply'; then
            echo 'A usable maintainer email was not present in commit metadata.' >&2
            exit 1
          fi
          echo "INFORELAY_CONTACT_EMAIL=$CONTACT_EMAIL" >> "$GITHUB_ENV"

      - name: Verify one-time free submission marker
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('growth/submissions/inforelay-v1.json').read_text())
          assert p['submission_id'] == 'inforelay-maglasync-free-2026-08-30-v1'
          assert p['category'] == 'productivity'
          assert p['pricing'] == 'free'
          assert p['url'] == 'https://sync.magla.ru/en/'
          assert 0 < len(p['tagline']) <= 70
          assert 'submitterEmail' not in p
          print('INFORELAY_MARKER_OK=1')
          PY

      - name: Install isolated Playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/maglasync-inforelay
          cd /tmp/maglasync-inforelay
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          ln -s /tmp/maglasync-inforelay/node_modules "$GITHUB_WORKSPACE/node_modules"

      - name: Submit one free InfoRelay listing
        run: node tools/submit-inforelay.mjs

      - name: Upload InfoRelay submission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inforelay-submission-evidence
          path: reports/growth/inforelay-v1/
          if-no-files-found: warn
          retention-days: 14
