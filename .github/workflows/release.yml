name: Release

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - tools/package.mjs
      - RELEASE_NOTES_v*.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: node --test
      - run: node tools/package.mjs --check
      - run: node tools/package.mjs
      - run: python tools/make_launch_assets.py
      - run: python tools/make_promo_videos.py
      - name: Build checksums
        run: |
          cd dist
          sha256sum \
            maglasync-free-chromium-v*.zip \
            maglasync-free-chromium-v*.zip.keep \
            maglasync-free-firefox-v*.zip \
            maglasync-free-safari-source-v*.zip \
            > SHA256SUMS.txt
      - id: version
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')"
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" \
              "dist/maglasync-free-chromium-v${VERSION}.zip" \
              "dist/maglasync-free-chromium-v${VERSION}.zip.keep" \
              "dist/maglasync-free-firefox-v${VERSION}.zip" \
              "dist/maglasync-free-safari-source-v${VERSION}.zip" \
              dist/SHA256SUMS.txt \
              --clobber
            echo "Updated reproducible packages and Safari-preserved publisher archive for v${VERSION}"
            exit 0
          fi
          gh release create "v${VERSION}" \
            "dist/maglasync-free-chromium-v${VERSION}.zip" \
            "dist/maglasync-free-chromium-v${VERSION}.zip.keep" \
            "dist/maglasync-free-firefox-v${VERSION}.zip" \
            "dist/maglasync-free-safari-source-v${VERSION}.zip" \
            dist/SHA256SUMS.txt \
            assets/promo/maglasync-tiktok-ru.mp4 \
            assets/promo/maglasync-youtube-ru.mp4 \
            --title "MaglaSync Free v${VERSION}" \
            --notes-file "RELEASE_NOTES_v${VERSION}.md"
