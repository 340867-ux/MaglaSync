name: Bug report
description: Report a reproducible MaglaSync problem without sharing private chat content.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: AI site
      options:
        - ChatGPT
        - Claude
        - Gemini
        - Extension dashboard or popup
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MaglaSync version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use placeholders instead of private project or conversation text.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed and expected behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private messages, backups, cookies, tokens, and account identifiers.
          required: true
